name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run build
      - name: Ensure generated artifacts are in sync
        run: git diff --exit-code -- deepseek-unlimited.user.js deepseek-unlimited.meta.js
